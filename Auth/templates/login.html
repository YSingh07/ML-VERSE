
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#080B14] text-white flex items-center justify-center px-4 py-10">

    <!-- Background Glow -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-600/15 blur-[120px] rounded-full"></div>
    </div>

    <!-- Main Container -->
    <div class="relative w-full max-w-md">

        <!-- Login Card -->
        <div class="bg-[#111827]/90 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl shadow-black/40">

            <!-- Heading -->
            <div class="text-center mb-8">

                <!-- Logo -->
                <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <span class="text-2xl font-bold">↗</span>
                </div>

                <h1 class="text-3xl font-bold tracking-tight">
                    Welcome Back
                </h1>

                <p class="text-gray-400 mt-2 text-sm">
                    Sign in to continue to your account
                </p>

            </div>

            <!-- Login Form -->
            <form action="/login" method="POST" class="space-y-5">

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        class="w-full px-4 py-3 bg-[#0B0F19] border border-gray-700/70 rounded-xl text-white placeholder-gray-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition duration-300"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        class="w-full px-4 py-3 bg-[#0B0F19] border border-gray-700/70 rounded-xl text-white placeholder-gray-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition duration-300"
                    >
                </div>

                <!-- Forgot Password -->
                <div class="flex justify-end">
                    <a
                        href="#"
                        class="text-sm text-blue-400 hover:text-blue-300 transition duration-300"
                    >
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/20 hover:shadow-blue-500/30 hover:-translate-y-0.5 transition duration-300"
                >
                    Sign In
                </button>

            </form>

            <!-- Flash Messages -->
            <div class="mt-4">
                {% include "flash.html" %}
            </div>

            <!-- Signup -->
            <p class="text-center text-gray-400 text-sm mt-6">
                Don't have an account?
                <a
                    href="{{ url_for('auth.reg') }}"
                    class="text-blue-400 hover:text-blue-300 font-medium transition"
                >
                    Create one
                </a>
            </p>

            <!-- Back to Home -->
            <a
                href="{{ url_for('home') }}"
                class="block w-full text-center mt-4 py-3 border border-gray-700 hover:border-gray-500 hover:bg-white/5 text-gray-300 hover:text-white font-medium rounded-xl transition duration-300"
            >
                ← Back to Home
            </a>

        </div>

        <!-- Footer -->
        <p class="text-center text-gray-600 text-xs mt-6">
            Secure login · Built with Flask
        </p>

    </div>

</body>
</html>
