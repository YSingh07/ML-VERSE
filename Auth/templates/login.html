<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#0B0D12] flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-[#151922] border border-gray-800 rounded-2xl p-8 shadow-2xl">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">
                Welcome Back
            </h1>

            <p class="text-gray-400 mt-2">
                Sign in to your account
            </p>
        </div>

        <!-- Login Form -->
        <form action="/login" method="POST" class="space-y-5">

            <!-- Email -->
            <div>
                <label for="username" class="block text-sm text-gray-300 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="enter your username"
                    required
                    class="w-full px-4 py-3 bg-[#0B0D12] border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500 transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm text-gray-300 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full px-4 py-3 bg-[#0B0D12] border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500 transition"
                >
            </div>

            <!-- Forgot Password -->
            <div class="flex justify-end">
                <a href="#" class="text-sm text-blue-400 hover:text-blue-300">
                    Forgot password?
                </a>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-300"
            >
                Sign In
            </button>

        </form>
        {% include "flash.html" %}
        <!-- Signup -->
        <p class="text-center text-gray-400 text-sm mt-6">
            Don't have an account?
            <a href="{{url_for('auth.reg')}}" class="text-blue-400 hover:text-blue-300">
                Create one
            </a>
        </p>

        <button
                    type="button"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-300"
                >
                    <a href="{{url_for('home')}}">back to home</a>
        </button>

    </div>

</body>
</html>
