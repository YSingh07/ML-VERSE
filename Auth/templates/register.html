<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#0B0D12] text-white">


    <div class="flex items-center justify-center px-4 py-12">

        <div class="w-full max-w-md bg-[#151922] border border-gray-800 rounded-2xl p-8 shadow-2xl">

            <!-- Heading -->
            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold">
                    Create Account
                </h1>

                <p class="text-gray-400 mt-2">
                    Join us and get started
                </p>

            </div>

            <!-- Register Form -->
            <form action="{{url_for("add_user")}}" method="POST" class="space-y-5">

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm text-gray-300 mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        class="w-full px-4 py-3 bg-[#0B0D12] border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500 transition"
                    >
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm text-gray-300 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        class="w-full px-4 py-3 bg-[#0B0D12] border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500 transition"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm text-gray-300 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        class="w-full px-4 py-3 bg-[#0B0D12] border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500 transition"
                    >
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-sm text-gray-300 mb-2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                        class="w-full px-4 py-3 bg-[#0B0D12] border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500 transition"
                    >
                </div>

                <!-- Register Button -->
                <button
                    type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-300"
                >
                    Create Account
                </button>

                

            </form>

            {% include "flash.html" %}

            <!-- Login Link -->
            <p class="text-center text-gray-400 text-sm mt-6">
                Already have an account?
                <a href="{{ url_for('auth.log') }}" class="text-blue-400 hover:text-blue-300">
                    Login
                </a>
            </p>

            <button
                    type="button"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-300"
                >
                    <a href="{{url_for('home')}}">back to home</a>
            </button>

        </div>

    </div>

</body>
</html>
