{% extends 'base.html' %}

{% block content %}
  <section class="py-5" style="background-color:azure;">
    <div class="container">
      <div class="row g-4">
        {% for item in project %}
          <div class="col-md-4" >
            <div class="card product-card border-1 shadow-sm h-100" style="border-radius:10px;" >
              <div class="product-image-wrapper position-relative">
                <img src="{{ url_for('static', filename=item.img) }}" class="card-img-top product-image" alt="{{ item.name }}" />

              </div>

              <div class="card-body p-4">
                <h5 class="product-title fw-semibold mb-2">{{ item.name }}</h5>

                <p class="text-muted small mb-1">{{ item.model }}</p>

                <p class="text-muted small">{{ item.description }}</p>

                <button type="button" class="btn btn-outline-dark" aria-label="View details"><i class="bi bi-eye"></i></button>
              </div>
            </div>
          </div>
        {% else %}
          <div class="col-12 text-center">
            <p>No projects found!</p>
          </div>
        {% endfor %}
      </div>
    </div>
  </section>
{% endblock %}
