{% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
        {% for category, message in messages %}
            {% if category=="danger" %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert" style="color: red;">
                    {{ message }}

                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% elif category=="success" %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert" style="color: greenyellow;">
                    {{ message }}

                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

            {% endif %}
        {% endfor %}
    {% endif %}
{% endwith %}
